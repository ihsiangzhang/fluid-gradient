<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Gradient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #canvas-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas { border-radius: 24px; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      gap: 20px;
    }
    #overlay svg {
      width: 260px;
      height: auto;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.3));
    }
    #overlay .tagline {
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,0.4));
    }
    #switcher {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
      max-width: 90vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #switcher::-webkit-scrollbar { display: none; }
    #theme-label {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 1.5px;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .swatch {
      width: 30px; height: 30px;
      min-width: 30px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.25s, transform 0.2s;
      position: relative;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { border-color: #fff; }
    .swatch .tooltip {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .swatch:hover .tooltip { opacity: 1; }
    #mode-toggle {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      z-index: 10;
    }
    .mode-btn {
      width: 36px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      transition: background 0.25s, color 0.25s;
      border: none;
      background: none;
      font-family: 'Inter', sans-serif;
    }
    .mode-btn:hover { color: rgba(255,255,255,0.7); }
    .mode-btn.active {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
  </style>
</head>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;
    uniform float u_time;
    uniform vec2  u_resolution;
    uniform vec3  u_c1, u_c2, u_c3, u_c4, u_c5;
    uniform float u_mode; // 0.0 = normal, 1.0 = light, -1.0 = dark

    vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x  = x_ * ns.x + ns.yyyy;
      vec4 y  = y_ * ns.x + ns.yyyy;
      vec4 h  = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }

    float fbm(vec3 p) {
      float v = 0.0, amp = 0.6;
      vec3 shift = vec3(100.0);
      for (int i = 0; i < 2; i++) {
        v += amp * snoise(p);
        p = p * 2.0 + shift;
        amp *= 0.4;
      }
      return v;
    }

    float fluidNoise(vec2 uv, float t) {
      float n1 = fbm(vec3(uv * 0.6, t * 0.06));
      float n2 = fbm(vec3(uv * 0.6 + 5.2, t * 0.06 + 1.3));
      vec2 warp1 = vec2(n1, n2) * 0.6;
      float n3 = fbm(vec3((uv + warp1) * 0.7 + 1.7, t * 0.05 + 3.1));
      float n4 = fbm(vec3((uv + warp1) * 0.7 + 9.2, t * 0.05 + 5.7));
      vec2 warp2 = vec2(n3, n4) * 0.5;
      return fbm(vec3((uv + warp1 + warp2) * 0.5, t * 0.04));
    }

    vec2 curlish(vec2 uv, float t) {
      float eps = 0.02;
      float n  = snoise(vec3(uv * 0.8, t));
      float nx = snoise(vec3((uv + vec2(eps, 0.0)) * 0.8, t));
      float ny = snoise(vec3((uv + vec2(0.0, eps)) * 0.8, t));
      return vec2(-(ny - n) / eps, (nx - n) / eps) * 0.003;
    }

    float hash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    float brushStroke(vec2 uv, float angle, float freq) {
      float c = cos(angle), s = sin(angle);
      vec2 ruv = vec2(c * uv.x - s * uv.y, s * uv.x + c * uv.y);
      ruv.x *= 3.0;
      return snoise(vec3(ruv * freq, 0.0));
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      vec2 px = gl_FragCoord.xy;
      float t = u_time;

      vec2 curl = curlish(uv, t * 0.04);
      vec2 uvD = uv + curl * 25.0;
      float f = fluidNoise(uvD, t);
      float swirl = snoise(vec3(uvD * 0.8 + f * 1.5, t * 0.035)) * 0.5 + 0.5;

      float eps2 = 0.005;
      float fx = fluidNoise(uvD + vec2(eps2, 0.0), t);
      float fy = fluidNoise(uvD + vec2(0.0, eps2), t);
      float angle = atan(fy - f, fx - f);

      float stroke1 = brushStroke(uv, angle, 60.0) * 0.5 + 0.5;
      float stroke2 = brushStroke(uv, angle + 0.4, 120.0) * 0.5 + 0.5;
      float stroke3 = brushStroke(uv, angle - 0.3, 200.0) * 0.5 + 0.5;
      float brushTex = stroke1 * 0.5 + stroke2 * 0.3 + stroke3 * 0.2;

      float n = f * 0.5 + 0.5;
      vec3 col = mix(u_c1, u_c2, smoothstep(0.2, 0.5, n));
      col = mix(col, u_c3, smoothstep(0.35, 0.65, n + swirl * 0.25));
      col = mix(col, u_c4, smoothstep(0.6, 0.85, swirl) * 0.55);
      col = mix(col, u_c5, smoothstep(0.5, 0.8, n * swirl) * 0.35);

      col *= 0.85 + brushTex * 0.3;

      float impasto = smoothstep(0.7, 0.95, brushTex) * smoothstep(0.5, 0.8, swirl);
      col += vec3(0.12, 0.10, 0.05) * impasto;

      float hueShift = snoise(vec3(uv * 80.0, t * 0.01)) * 0.06;
      col.r += hueShift;
      col.b -= hueShift * 0.5;

      float grain = hash(px + fract(t * 7.0)) * 2.0 - 1.0;
      col += grain * 0.04;

      float weaveX = sin(px.x * 1.2) * 0.5 + 0.5;
      float weaveY = sin(px.y * 1.2) * 0.5 + 0.5;
      col *= 0.97 + weaveX * weaveY * 0.03;

      float vig = 1.0 - smoothstep(0.4, 0.78, length(uv - 0.5));
      col = mix(col * 0.75, col, vig * 0.35 + 0.65);

      // Mode: light (mix toward white) or dark (mix toward black)
      if (u_mode > 0.0) {
        col = mix(col, vec3(0.97, 0.97, 0.98), 0.82 * u_mode);
      } else if (u_mode < 0.0) {
        col = mix(col, vec3(0.02, 0.02, 0.03), 0.78 * (-u_mode));
      }

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

    // ===== WebGL Setup =====
    const canvas = document.getElementById('gradient');
    const wrap = document.getElementById('canvas-wrap');
    const gl = canvas.getContext('webgl');

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const cssSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.85);
      canvas.style.width = cssSize + 'px';
      canvas.style.height = cssSize + 'px';
      wrap.style.width = cssSize + 'px';
      wrap.style.height = cssSize + 'px';
      canvas.width = cssSize * dpr;
      canvas.height = cssSize * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    function compileShader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        console.error(gl.getShaderInfoLog(s));
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
    gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes  = gl.getUniformLocation(prog, 'u_resolution');
    const uMode = gl.getUniformLocation(prog, 'u_mode');
    const uColors = [1,2,3,4,5].map(i => gl.getUniformLocation(prog, 'u_c' + i));

    // ===== Mode state =====
    let currentMode = 0.0;  // 0 = normal, 1 = light, -1 = dark
    let targetMode = 0.0;

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        targetMode = mode === 'light' ? 1.0 : mode === 'dark' ? -1.0 : 0.0;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Update overlay colors for light mode
        const overlay = document.getElementById('overlay');
        const logoFill = mode === 'light' ? '#222' : '#fff';
        overlay.querySelectorAll('path').forEach(p => p.setAttribute('fill', logoFill));
        overlay.querySelector('.tagline').style.color = logoFill;
      });
    });

    // ===== Color transition state =====
    let currentColors = themes[0].colors.map(c => [...c]);
    let targetColors  = themes[0].colors.map(c => [...c]);
    let transitionProgress = 1.0;

    function lerpColor(a, b, t) {
      return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
    }

    function setTheme(index) {
      targetColors = themes[index].colors.map(c => [...c]);
      transitionProgress = 0.0;
      document.querySelectorAll('.swatch').forEach((s, i) =>
        s.classList.toggle('active', i === index));
      document.getElementById('theme-label').textContent = themes[index].name;
    }

    // ===== Build switcher UI =====
    const switcher = document.getElementById('switcher');
    themes.forEach((theme, i) => {
      const el = document.createElement('div');
      el.className = 'swatch' + (i === 0 ? ' active' : '');
      const gradient = theme.preview.length >= 3
        ? `linear-gradient(135deg, ${theme.preview[0]}, ${theme.preview[1]}, ${theme.preview[2]})`
        : `linear-gradient(135deg, ${theme.preview[0]}, ${theme.preview[1]})`;
      el.style.background = gradient;
      el.innerHTML = `<span class="tooltip">${theme.name}</span>`;
      el.addEventListener('click', () => setTheme(i));
      switcher.appendChild(el);
    });

    // ===== Render loop =====
    function draw(t) {
      // Smooth color transition
      if (transitionProgress < 1.0) {
        transitionProgress = Math.min(1.0, transitionProgress + 0.012);
        const ease = transitionProgress < 0.5
          ? 2 * transitionProgress * transitionProgress
          : 1 - Math.pow(-2 * transitionProgress + 2, 2) / 2;
        for (let i = 0; i < 5; i++) {
          currentColors[i] = lerpColor(currentColors[i], targetColors[i], ease > 0.99 ? 1 : 0.06);
        }
      }

      // Smooth mode transition
      currentMode += (targetMode - currentMode) * 0.05;

      for (let i = 0; i < 5; i++) {
        gl.uniform3f(uColors[i], currentColors[i][0], currentColors[i][1], currentColors[i][2]);
      }

      gl.uniform1f(uMode, currentMode);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, t * 0.001);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(draw);
    }

    setTheme(0); // Start with Starry Night
    transitionProgress = 1.0;
    currentColors = themes[0].colors.map(c => [...c]);
    requestAnimationFrame(draw);
